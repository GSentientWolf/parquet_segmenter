name: CI

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-matrix:
    name: Tests (engine: ${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [pyarrow, fastparquet]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-${{ matrix.engine }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install the matrix parquet engine so each job exercises that path.
          pip install "${{ matrix.engine }}"

      - name: Run unit tests
        run: python -m pytest __tests__/unit -q

      - name: Run mypy
        run: python -m mypy src

      - name: Run pylint
        run: python -m pylint src
