services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /home/victor/Desktop/Projects/Testers/parquet_segmenter:/workspace/parquet_segmenter:cached
    tty: true
    environment:
      - DEBIAN_FRONTEND=noninteractive
    networks:
      - devnet

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    # Expose the DB port to other compose services only; avoid binding to host
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devnet

volumes:
  postgres_data:

networks:
  devnet:
    driver: bridge
